name: wechat_demo
title: 用九宫格拼音在微信输入并发送“你好”
version: 1
description: >-
  固定流程示例。要求微信已打开“文件传输助手”聊天，屏幕标定对应当前机器。
  流程会核对标题、输入法与草稿，默认停在发送前；遇到未知画面会留截图并停止。
  坐标来自一台具体设备，换手机/换摆位后必须重新标定。

preconditions:
  - text: 文件传输助手
    roi: [0.25, 0.22, 0.55, 0.28]
    present: true

steps:
  - type: ensure_keyboard
    label: 确认聊天输入框和键盘
    marker: ABC
    roi: [0.24, 0.52, 0.50, 0.60]
    focus_u: 0.35
    focus_v: 0.93
    settle_seconds: 0.7

  - type: tap_sequence
    label: 连续输入拼音 nihao 并选中候选
    points:
      - {u: 0.69, v: 0.79} # N: MNO
      - {u: 0.26, v: 0.79} # I: GHI
      - {u: 0.26, v: 0.79} # H: GHI
      - {u: 0.47, v: 0.73} # A: ABC
      - {u: 0.69, v: 0.79} # O: MNO
      - {u: 0.08, v: 0.67} # 输入法首候选「你好」

  - type: check_text
    label: 核对发送框中的草稿
    text: 你好
    roi: [0.20, 0.47, 0.40, 0.52]
    present: true

  - type: tap
    label: 发送前复核并确认
    approval: send
    verify_before:
      - text: 文件传输助手
        roi: [0.25, 0.22, 0.55, 0.28]
        present: true
      - text: 你好
        roi: [0.20, 0.47, 0.40, 0.52]
        present: true
      - text: ABC
        roi: [0.24, 0.52, 0.50, 0.60]
        present: true
    u: 0.88
    v: 0.59
    dwell_ms: 120

  - type: wait
    label: 等待聊天画面更新
    seconds: 1.0

  - type: check_text
    label: 确认最新消息已显示
    text: 你好
    roi: [0.41, 0.42, 0.58, 0.49]
    present: true
